services:
  web:
    build: .
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.services.oliviermaghe.loadbalancer.server.port=80"

      - "traefik.http.routers.oliviermaghe-com.rule=Host(`oliviermaghe.com`) || Host(`www.oliviermaghe.com`)"
      - "traefik.http.routers.oliviermaghe-com.entrypoints=websecure"
      - "traefik.http.routers.oliviermaghe-com.tls.certresolver=letsencrypt"
      - "traefik.http.routers.oliviermaghe-com.service=oliviermaghe"

      - "traefik.http.routers.oliviermaghe-be.rule=Host(`oliviermaghe.be`) || Host(`www.oliviermaghe.be`)"
      - "traefik.http.routers.oliviermaghe-be.entrypoints=websecure"
      - "traefik.http.routers.oliviermaghe-be.tls.certresolver=letsencrypt"
      - "traefik.http.routers.oliviermaghe-be.service=oliviermaghe"

      - "traefik.http.routers.maghe-be.rule=Host(`maghe.be`) || Host(`www.maghe.be`) || Host(`olivier.maghe.be`)"
      - "traefik.http.routers.maghe-be.entrypoints=websecure"
      - "traefik.http.routers.maghe-be.tls.certresolver=letsencrypt"
      - "traefik.http.routers.maghe-be.service=oliviermaghe"

      - "traefik.http.routers.maghe-es.rule=Host(`maghe.es`) || Host(`www.maghe.es`) || Host(`olivier.maghe.es`)"
      - "traefik.http.routers.maghe-es.entrypoints=websecure"
      - "traefik.http.routers.maghe-es.tls.certresolver=letsencrypt"
      - "traefik.http.routers.maghe-es.service=oliviermaghe"

      - "traefik.http.routers.cssbattle.rule=Host(`cssbattle.oliviermaghe.com`) || Host(`cssbattle.oliviermaghe.be`) || Host(`cssbattle.maghe.be`) || Host(`cssbattle.maghe.es`)"
      - "traefik.http.routers.cssbattle.entrypoints=websecure"
      - "traefik.http.routers.cssbattle.tls.certresolver=letsencrypt"
      - "traefik.http.routers.cssbattle.service=oliviermaghe"
      - "traefik.http.routers.cssbattle.middlewares=cssbattle-redirect"
      - "traefik.http.middlewares.cssbattle-redirect.redirectregex.regex=^https://cssbattle\\..*"
      - "traefik.http.middlewares.cssbattle-redirect.redirectregex.replacement=https://oliviermaghe.com/css-battle.html"
      - "traefik.http.middlewares.cssbattle-redirect.redirectregex.permanent=true"

  umami-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: umami
      POSTGRES_USER: umami
      POSTGRES_PASSWORD: ${UMAMI_DB_PASSWORD}
    volumes:
      - umami-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U umami"]
      interval: 5s
      timeout: 5s
      retries: 5

  umami:
    image: ghcr.io/umami-software/umami:postgresql-latest
    restart: unless-stopped
    depends_on:
      umami-db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://umami:${UMAMI_DB_PASSWORD}@umami-db:5432/umami
      APP_SECRET: ${UMAMI_APP_SECRET}
    labels:
      - "traefik.enable=true"
      - "traefik.http.services.umami.loadbalancer.server.port=3000"

      - "traefik.http.routers.umami.rule=Host(`stats.oliviermaghe.com`)"
      - "traefik.http.routers.umami.entrypoints=websecure"
      - "traefik.http.routers.umami.tls.certresolver=letsencrypt"
      - "traefik.http.routers.umami.service=umami"

volumes:
  umami-db-data:
