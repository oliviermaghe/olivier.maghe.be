services:
  web:
    build: .
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.oliviermaghe.rule=Host(`oliviermaghe.com`) || Host(`www.oliviermaghe.com`) || Host(`olivier.maghe.be`) || Host(`www.olivier.maghe.be`)"
      - "traefik.http.routers.oliviermaghe.entrypoints=websecure"
      - "traefik.http.routers.oliviermaghe.tls.certresolver=letsencrypt"
      - "traefik.http.services.oliviermaghe.loadbalancer.server.port=80"
